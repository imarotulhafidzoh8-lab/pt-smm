<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2744"/>
      <stop offset="50%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0F2744" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="500" height="400" fill="url(#bg)"/>
  <circle cx="250" cy="180" r="160" fill="url(#glow)"/>
  
  <!-- Category Badge -->
  <rect x="150" y="24" width="200" height="28" rx="14" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.25)"/>
  <text x="250" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#34D399" text-anchor="middle" letter-spacing="1">PERTANIAN &amp; PUPUK</text>
  
  <!-- Bottle / Product Silhouette -->
  <g filter="url(#shadow)">
    <!-- Cap -->
    <rect x="225" y="80" width="50" height="25" rx="5" fill="#34D399"/>
    <rect x="233" y="105" width="34" height="20" fill="#E2E8F0"/>
    <!-- Body -->
    <path d="M190 145 C190 125, 230 125, 233 125 L267 125 C270 125, 310 125, 310 145 L315 260 C315 275, 305 285, 290 285 L210 285 C195 285, 185 275, 185 260 Z" fill="#FFFFFF"/>
    <!-- Label -->
    <rect x="195" y="160" width="110" height="95" rx="6" fill="#0F2744"/>
    <circle cx="250" cy="190" r="16" fill="#34D399"/>
    <path d="M246 190 L249 193 L256 186" stroke="#0F2744" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <text x="250" y="222" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">BIO-HARVEST</text>
    <text x="250" y="236" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="600" fill="#34D399" text-anchor="middle">ORGANIK 1 LITER</text>
  </g>
  
  <!-- Bottom Pill -->
  <rect x="130" y="340" width="240" height="32" rx="16" fill="#0A192F" stroke="#34D399" stroke-width="1.5"/>
  <text x="250" y="360" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">PT SHAFA MARWA MULTIGUNA</text>
</svg>
